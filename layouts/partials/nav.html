<header class="site-header">
  <nav class="site-nav">
    <a class="logo" href="{{ .Site.BaseURL }}">
      {{ .Site.Params.logo }}
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" type="button">&#9776;</button>
    <ul class="main-menu">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}">{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
